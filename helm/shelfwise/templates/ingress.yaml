{{- if .Values.ingress.enabled }}
# / goes to the React frontend, /api (and the API docs) straight to FastAPI.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "shelfwise.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}}
          - path: /docs
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}}
          - path: /openapi.json
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-backend, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: {{ .Release.Name }}-frontend, port: {number: 80}}}
{{- end }}
