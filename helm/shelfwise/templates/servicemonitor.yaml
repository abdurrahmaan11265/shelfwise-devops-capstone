{{- if .Values.monitoring.serviceMonitor.enabled }}
# Tells the Prometheus operator to scrape /metrics on every backend pod.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    release: {{ .Values.monitoring.serviceMonitor.releaseLabel }}
    {{- include "shelfwise.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
